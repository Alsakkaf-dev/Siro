<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA COMMAND CENTER — Finals Engine</title>
<style>
/* ============================================================
   AAA COMMAND CENTER — Design System (dependency-free)
   Dark gamified developer HUD · CSS custom properties
   ============================================================ */
:root{
  --bg0:#07090f; --bg1:#0b0e17; --bg2:#111527; --bg3:#171c33;
  --card:rgba(23,28,51,.72); --card2:rgba(30,36,66,.85);
  --line:rgba(124,140,255,.14); --line2:rgba(124,140,255,.28);
  --tx0:#eef1ff; --tx1:#aab3d6; --tx2:#6b7499;
  --psda:#a78bfa; --nc:#22d3ee; --cross:#fbbf24; --sda:#fb7185; --bi:#34d399;
  --gold:#fde047; --xp:#7c8cff; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --r:14px; --r2:20px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 800px at 85% -10%, rgba(124,140,255,.10), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(52,211,153,.07), transparent 60%),
    var(--bg0);
  color:var(--tx0);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  min-height:100vh; overflow-x:hidden;
}
::selection{background:rgba(124,140,255,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:8px;border:2px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:#232a4d}
mono,.mono,code,kbd{font-family:"Cascadia Code","Consolas","JetBrains Mono",monospace}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
@media(max-width:980px){#app{grid-template-columns:1fr}
  #sidebar{position:fixed;z-index:60;left:-260px;transition:left .25s;height:100vh}
  #sidebar.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  #burger{display:flex!important}}
#sidebar{
  background:linear-gradient(180deg,var(--bg1),var(--bg0));
  border-right:1px solid var(--line); padding:18px 14px;
  display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo .t{font-weight:800;letter-spacing:.06em;font-size:.95rem}
.logo .t small{display:block;color:var(--tx2);font-weight:500;letter-spacing:.14em;font-size:.62rem}
.navsec{color:var(--tx2);font-size:.62rem;letter-spacing:.2em;font-weight:700;padding:12px 10px 4px}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;
  color:var(--tx1);border:1px solid transparent;font-weight:600;font-size:.86rem;user-select:none;
  transition:all .15s;
}
.navbtn:hover{background:var(--bg2);color:var(--tx0)}
.navbtn.active{background:linear-gradient(90deg,rgba(124,140,255,.16),rgba(124,140,255,.05));border-color:var(--line2);color:var(--tx0)}
.navbtn .dot{width:8px;height:8px;border-radius:50%;flex:none}
.navbtn .pct{margin-left:auto;font-size:.68rem;color:var(--tx2);font-family:Consolas,monospace}
.navbtn.active .pct{color:var(--xp)}
#sideFoot{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:.68rem;color:var(--tx2);line-height:1.6}

/* ---------- Main column ---------- */
#main{display:flex;flex-direction:column;min-width:0}
#hud{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 22px;background:rgba(11,14,23,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
#burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--tx0);align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem}
.hudstat{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:11px;background:var(--bg2);border:1px solid var(--line)}
.hudstat .lab{font-size:.6rem;color:var(--tx2);letter-spacing:.12em;font-weight:700}
.hudstat .val{font-weight:800;font-size:.95rem;font-family:Consolas,monospace}
.hudstat.gold .val{color:var(--gold)} .hudstat.xp .val{color:var(--xp)}
.hudstat.streak .val{color:#ff9d5c} .hudstat.days .val{color:var(--nc)}
#velocityChip{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:11px;font-weight:800;font-size:.8rem;border:1px solid}
#velocityChip.ok{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
#velocityChip.ahead{color:var(--nc);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
#velocityChip.lag{color:var(--bad);border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.1);animation:lagflash 1.1s infinite}
@keyframes lagflash{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,0)}50%{box-shadow:0 0 18px 2px rgba(251,113,133,.45)}}
#view{padding:24px 26px 80px;max-width:1280px;width:100%;margin:0 auto}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px;backdrop-filter:blur(6px)}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}
h1.pagetitle{font-size:1.45rem;letter-spacing:.01em;margin-bottom:4px}
.sub{color:var(--tx1);font-size:.86rem;line-height:1.55}
.sectitle{display:flex;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.18em;font-weight:800;color:var(--tx2);margin:26px 0 12px;text-transform:uppercase}
.sectitle::after{content:"";flex:1;height:1px;background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:700;border:1px solid var(--line2);color:var(--tx1)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:11px;
  border:1px solid var(--line2);background:var(--bg2);color:var(--tx0);font-weight:700;font-size:.83rem;
  cursor:pointer;transition:all .15s;user-select:none;font-family:inherit;
}
.btn:hover{background:var(--bg3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,#5865f2,#7c8cff);border-color:transparent;color:#fff;box-shadow:0 4px 18px rgba(124,140,255,.3)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(251,113,133,.5);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 11px;font-size:.74rem;border-radius:9px}

/* ---------- Progress bars & rings ---------- */
.pbar{height:9px;border-radius:99px;background:var(--bg1);border:1px solid var(--line);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.2);
  background:linear-gradient(90deg,#5865f2,#7c8cff)}
.pbar.thick{height:14px}
.ringwrap{position:relative;width:max-content}
.ringwrap .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .ringtxt b{font-size:1.5rem;font-family:Consolas,monospace}
.ringwrap .ringtxt span{font-size:.6rem;color:var(--tx2);letter-spacing:.15em;font-weight:700}

/* ---------- Checklist rows ---------- */
.task{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);cursor:pointer;transition:all .15s;user-select:none}
.task:hover{border-color:var(--line2)}
.task .box{width:21px;height:21px;border-radius:7px;border:2px solid var(--tx2);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.task .box svg{opacity:0;transform:scale(.4);transition:all .18s}
.task.done{opacity:.78}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .box svg{opacity:1;transform:scale(1)}
.task.done .tt{text-decoration:line-through;color:var(--tx1)}
.task .tt{font-weight:600;font-size:.85rem;line-height:1.4}
.task .td{font-size:.72rem;color:var(--tx2);margin-top:2px;line-height:1.45}
.task .xptag{margin-left:auto;flex:none;font-size:.66rem;font-weight:800;color:var(--xp);font-family:Consolas,monospace;padding-top:2px}
.task.locked{opacity:.45;cursor:not-allowed}
.task.locked .box{border-style:dashed}
.task.gatewarn{border-left:3px solid var(--warn)}
.task.gatewarn .td::after{content:" · ⛓ prerequisite above not done";color:var(--warn);font-weight:700}

/* ---------- Timeline ---------- */
#timelineRow{display:flex;gap:9px;overflow-x:auto;padding:6px 2px 14px}
.daycell{flex:none;width:86px;border:1px solid var(--line);border-radius:13px;background:var(--bg2);padding:9px 8px;cursor:pointer;text-align:center;transition:all .15s;position:relative}
.daycell:hover{border-color:var(--line2);transform:translateY(-2px)}
.daycell.sel{border-color:var(--xp);background:linear-gradient(180deg,rgba(124,140,255,.15),var(--bg2))}
.daycell.today::before{content:"TODAY";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  font-size:.52rem;font-weight:900;letter-spacing:.1em;background:var(--xp);color:#0b0e17;padding:2px 7px;border-radius:99px}
.daycell.past{opacity:.55}
.daycell .dnum{font-weight:900;font-size:1.05rem;font-family:Consolas,monospace}
.daycell .dmon{font-size:.58rem;color:var(--tx2);letter-spacing:.12em;font-weight:700}
.daycell .dpct{margin-top:5px;font-size:.6rem;font-family:Consolas,monospace;color:var(--tx2)}
.daycell .mini{height:4px;border-radius:99px;background:var(--bg0);margin-top:4px;overflow:hidden}
.daycell .mini i{display:block;height:100%;background:var(--ok)}
.daycell.arena{border-color:rgba(253,224,71,.35)}
.daycell.arena .dnum{color:var(--gold)}

/* ---------- Subject portal headers ---------- */
.portalhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px;border-radius:var(--r2);
  border:1px solid var(--line);position:relative;overflow:hidden}
.portalhead::before{content:"";position:absolute;inset:0;opacity:.13;background:var(--phgrad)}
.portalhead>*{position:relative}
.risk{font-size:.62rem;font-weight:900;letter-spacing:.14em;padding:4px 10px;border-radius:99px}
.risk.crit{background:rgba(251,113,133,.16);color:var(--bad);border:1px solid rgba(251,113,133,.4)}
.risk.high{background:rgba(251,191,36,.13);color:var(--warn);border:1px solid rgba(251,191,36,.4)}
.risk.med{background:rgba(34,211,238,.1);color:var(--nc);border:1px solid rgba(34,211,238,.35)}
.intel{border-left:3px solid var(--warn);background:rgba(251,191,36,.06);padding:10px 14px;border-radius:0 12px 12px 0;font-size:.8rem;color:var(--tx1);line-height:1.6;margin:8px 0}
.intel b{color:var(--tx0)}
.intel.red{border-color:var(--bad);background:rgba(251,113,133,.06)}
.intel.green{border-color:var(--ok);background:rgba(52,211,153,.06)}

/* ---------- PSDA template grid ---------- */
.qblock{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:14px}
.qblock .qhead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.qblock .qn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:Consolas,monospace;background:rgba(167,139,250,.15);color:var(--psda);border:1px solid rgba(167,139,250,.35)}
.qblock .marks{margin-left:auto;font-size:.66rem;color:var(--tx2);font-weight:800}
.minicheck{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:.76rem;color:var(--tx1);transition:background .12s}
.minicheck:hover{background:var(--bg3)}
.minicheck .mbox{width:16px;height:16px;border-radius:5px;border:2px solid var(--tx2);flex:none;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#0b0e17;font-weight:900}
.minicheck.on .mbox{background:var(--psda);border-color:var(--psda)}
.minicheck.on{color:var(--tx0)}

/* ---------- Drill widget / Forge ---------- */
.drillq{font-size:.95rem;line-height:1.6;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);cursor:pointer;transition:all .14s;font-size:.86rem;line-height:1.5}
.opt:hover{border-color:var(--line2);background:var(--bg3)}
.opt .ol{font-weight:900;color:var(--tx2);font-family:Consolas,monospace;flex:none}
.opt.sel{border-color:var(--xp);background:rgba(124,140,255,.1)}
.opt.correct{border-color:var(--ok);background:rgba(52,211,153,.12);animation:pop .3s}
.opt.wrong{border-color:var(--bad);background:rgba(251,113,133,.12);animation:shake .35s}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.explain{border-left:3px solid var(--xp);background:rgba(124,140,255,.07);padding:11px 14px;border-radius:0 12px 12px 0;font-size:.8rem;color:var(--tx1);line-height:1.65;margin-top:10px}
.explain b{color:var(--tx0)}
input.ansbox{width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--line2);background:var(--bg1);
  color:var(--tx0);font-family:Consolas,monospace;font-size:.95rem;outline:none;transition:border .15s}
input.ansbox:focus{border-color:var(--xp);box-shadow:0 0 0 3px rgba(124,140,255,.15)}
input.ansbox.correct{border-color:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
input.ansbox.wrong{border-color:var(--bad);box-shadow:0 0 0 3px rgba(251,113,133,.18);animation:shake .35s}
.timerbar{height:6px;border-radius:99px;background:var(--bg1);overflow:hidden;margin:8px 0 2px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));transition:width 1s linear}
.scorefly{position:fixed;font-weight:900;font-family:Consolas,monospace;color:var(--gold);z-index:99;pointer-events:none;
  animation:fly 1.1s forwards;font-size:1.05rem;text-shadow:0 2px 12px rgba(0,0,0,.6)}
@keyframes fly{0%{opacity:0;transform:translateY(8px) scale(.7)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

/* ---------- Code / accordion ---------- */
pre.codeblock{background:#0a0d18;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;
  font-size:.78rem;line-height:1.65;color:#c9d4ff}
pre.codeblock .c{color:#5d688f}pre.codeblock .k{color:#82aaff}pre.codeblock .s{color:#c3e88d}pre.codeblock .f{color:#ffcb6b}pre.codeblock .hl{background:rgba(253,224,71,.14);border-radius:3px;padding:0 2px;color:var(--gold)}
details.acc{border:1px solid var(--line);border-radius:13px;background:var(--bg2);overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:10px;user-select:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .car{margin-left:auto;transition:transform .2s;color:var(--tx2)}
details.acc[open]>summary .car{transform:rotate(90deg)}
details.acc .accbody{padding:0 16px 14px}

/* ---------- Scenario decoder ---------- */
.scenario{font-size:.95rem;line-height:1.9;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px}
.clue{cursor:pointer;padding:1px 5px;border-radius:6px;background:rgba(124,140,255,.12);border-bottom:2px dashed var(--xp);transition:all .15s;font-weight:600}
.clue:hover{background:rgba(124,140,255,.25)}
.clue.solved{background:rgba(52,211,153,.16);border-bottom:2px solid var(--ok);color:var(--ok);cursor:default}
.patchip{padding:6px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;font-size:.76rem;font-weight:700;transition:all .13s}
.patchip:hover{border-color:var(--xp);background:rgba(124,140,255,.12)}
.patchip.right{border-color:var(--ok);background:rgba(52,211,153,.16);color:var(--ok)}
.patchip.wrongpick{border-color:var(--bad);background:rgba(251,113,133,.14);color:var(--bad);animation:shake .3s}

/* ---------- Badges ---------- */
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:15px;border:1px solid var(--line);background:var(--bg2);text-align:center;transition:all .2s}
.badge.unlocked{border-color:rgba(253,224,71,.4);background:linear-gradient(180deg,rgba(253,224,71,.07),var(--bg2));box-shadow:0 0 22px rgba(253,224,71,.08)}
.badge .bname{font-weight:800;font-size:.74rem}
.badge .bdesc{font-size:.64rem;color:var(--tx2);line-height:1.45}
.badge.locked{filter:grayscale(1);opacity:.42}
.badge svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}

/* ---------- Toast & modal ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:100}
.toast{display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);
  box-shadow:0 10px 32px rgba(0,0,0,.5);animation:tin .3s;max-width:330px;font-size:.82rem;font-weight:600}
.toast.gold{border-color:rgba(253,224,71,.5)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
#modalwrap{position:fixed;inset:0;background:rgba(5,7,12,.78);backdrop-filter:blur(6px);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
#modalwrap.show{display:flex}
#modal{background:var(--bg1);border:1px solid var(--line2);border-radius:22px;max-width:680px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;animation:pop .25s}
.levelup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:95;pointer-events:none}
.levelup .lvcard{animation:lvl 2.4s forwards;background:linear-gradient(135deg,#1a1f3d,#0e1226);border:1px solid rgba(253,224,71,.5);
  border-radius:24px;padding:34px 50px;text-align:center;box-shadow:0 0 80px rgba(253,224,71,.25)}
@keyframes lvl{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.confetti{position:fixed;width:9px;height:14px;z-index:94;pointer-events:none;animation:conf 2.6s linear forwards}
@keyframes conf{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Tables ---------- */
table.dt{width:100%;border-collapse:collapse;font-size:.78rem}
table.dt th{color:var(--tx2);text-transform:uppercase;font-size:.6rem;letter-spacing:.13em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.dt td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--tx1);line-height:1.5;vertical-align:top}
table.dt td b{color:var(--tx0)}
table.dt tr:hover td{background:rgba(124,140,255,.04)}
.tag{font-size:.6rem;font-weight:900;letter-spacing:.08em;padding:2px 8px;border-radius:99px}
.tag.trap{background:rgba(251,113,133,.14);color:var(--bad)}
.tag.fix{background:rgba(52,211,153,.13);color:var(--ok)}
.tag.vue{background:rgba(52,211,153,.13);color:#42d392}
.tag.node{background:rgba(132,204,22,.13);color:#a3e635}
.tag.php{background:rgba(124,140,255,.15);color:#9aa7ff}
.fade{animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.statline{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--tx1);padding:4px 0}
.statline b{font-family:Consolas,monospace;color:var(--tx0)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .kv{font-size:1.7rem;font-weight:900;font-family:Consolas,monospace}
.kpi .kl{font-size:.62rem;color:var(--tx2);letter-spacing:.16em;font-weight:800}
</style>
</head>
<body>
<!-- ============================================================
     SVG ASSET FOUNDRY — mascots, badges, icons (all inline, zero external)
     ============================================================ -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- gradients -->
    <linearGradient id="gPsda" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>

/* ============================================================
   §9 STATE ENGINE — store · persistence · streak · velocity
   ============================================================ */
const SKEY = "aaa_command_center_v1";
let memFallback = null;
const DEFAULT_STATE = () => ({
  xp:0, units:{}, psdaT:{}, biB:{}, crossAcc:{}, sdaDec:{}, ncDrill:{},
  forgeTags:{}, forgeHist:[], badges:{}, streak:{n:0,last:null}, selDay:null, bootAt:new Date().toISOString()
});
let S = load();
function load(){
  try{ const raw = localStorage.getItem(SKEY); if(raw){ const o = JSON.parse(raw); return Object.assign(DEFAULT_STATE(), o); } }
  catch(e){ memFallback = true; }
  return DEFAULT_STATE();
}
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify(S)); }
  catch(e){ memFallback = true; }
}
function touchStreak(){
  const today = new Date().toDateString();
  if(S.streak.last === today) return;
  const yest = new Date(Date.now()-DAY_MS).toDateString();
  S.streak.n = (S.streak.last === yest) ? S.streak.n + 1 : 1;
  S.streak.last = today;
}
/* mastery: static curriculum weight — units(10) + psdaT(2) + biB(3) + sdaDec(2) + crossAcc(1) + ncDrill(1) */
function mastery(subj){
  let got = 0, tot = 0;
  const inS = k => !subj || subj === k;
  SUBJ_KEYS.forEach(k=>{ if(!inS(k)) return;
    SUBJECTS[k].units.forEach(u=>{ tot += 10; if(S.units[k+":"+u.id]) got += 10; }); });
  if(inS("PSDA")){ tot += 18*2; got += Object.values(S.psdaT).filter(Boolean).length*2; }
  if(inS("BI")){ tot += 26*3; got += Object.values(S.biB).filter(Boolean).length*3; }
  if(inS("SDA")){ tot += 12*2; got += Object.values(S.sdaDec).filter(Boolean).length*2; }
  if(inS("Cross")){ tot += CROSS_SNIPPETS.length; got += Object.values(S.crossAcc).filter(Boolean).length; }
  if(inS("NC")){ tot += NC_DRILLS.length; got += Object.values(S.ncDrill).filter(v=>v===1).length; }
  return {pct: Math.min(100, Math.round(got/tot*100)), got, tot};
}
function level(){ return Math.floor(Math.sqrt(S.xp/60)) + 1; }
function lvlSpan(){ const L = level(); const lo = 60*(L-1)*(L-1), hi = 60*L*L; return {L, lo, hi, frac:(S.xp-lo)/(hi-lo)}; }
/* velocity: expected curriculum units due by END of yesterday vs completed */
function velocity(){
  const t = todayIdx();
  let exp = 0, done = 0, lagMap = {};
  SUBJ_KEYS.forEach(k=>SUBJECTS[k].units.forEach(u=>{
    const isDone = !!S.units[k+":"+u.id];
    if(u.day < t){ exp++; if(!isDone) lagMap[k]=(lagMap[k]||0)+1; }
    if(isDone) done++;
  }));
  const delta = done - exp;
  let status = "ok", label = "● ON TRACK";
  if(delta >= 2){ status="ahead"; label="▲ AHEAD OF CURVE +" + delta; }
  else if(delta <= -2){
    const worst = Object.entries(lagMap).sort((a,b)=>b[1]-a[1])[0];
    status="lag"; label="⚠ CRITICAL LAG " + delta + (worst ? " — " + worst[0] + " is dragging" : "");
  }
  return {delta, status, label, lagMap, exp, done};
}

  const key = k+":"+u.id, done = !!S.units[key];

/* ============================================================
   §15 VIEW — STUDY FORGE (mock-exam engine: timer · scoring · feedback)
   ============================================================ */
let FORGE = null; // active session {qs, i, score, answered, t0, perQ, timerId, left}
const QTIME = 75; // seconds per question
function forgePool(subj){
  let pool = FORGE_BANK.filter(q=>subj==="ALL"||q.s===subj);
  if(subj==="NC"||subj==="ALL"){
    NC_DRILLS.slice(0,6).forEach((d,i)=>pool.push({s:"NC",type:"input",q:d.q,a:d.a,exp:d.exp,nc:i}));
  }
  return pool;
}
function startForge(subj, n){
  const pool = forgePool(subj).sort(()=>Math.random()-.5).slice(0,n);
  FORGE = {subj, qs:pool, i:0, score:0, answered:false, results:[], left:QTIME, timerId:null};
  VIEW = "forge";
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.view==="forge"));
  render();
}
function forgeTick(){
  if(!FORGE || FORGE.answered) return;
  FORGE.left--;
  const bar = $("#ftimer"); const lab = $("#ftlab");
  if(bar){ bar.style.width = (FORGE.left/QTIME*100)+"%"; }
  if(lab){ lab.textContent = FORGE.left+"s"; lab.style.color = FORGE.left<=15?"var(--bad)":"var(--tx2)"; }
  if(FORGE.left<=0){ forgeAnswer(-1, null); }
  else FORGE.timerId = setTimeout(forgeTick, 1000);
}
function forgeAnswer(pick, ev, inputVal){
  if(FORGE.answered) return;
  clearTimeout(FORGE.timerId); FORGE.answered = true;
  const q = FORGE.qs[FORGE.i];
  let ok = false;
  if(q.type==="mcq") ok = (pick===q.a);
  else { const norm = s=>String(s||"").toLowerCase().replace(/\s+/g,"").replace(/^\//,""); ok = q.a.some(a=>norm(a)===norm(inputVal)); }
  if(ok){ FORGE.score++; const xp = 14 + Math.max(0, Math.round(FORGE.left/10)); gain(xp, ev);
    if(q.tag){ S.forgeTags[q.tag] = (S.forgeTags[q.tag]||0)+1; checkBadges(); }
    if(q.nc!=null && !S.ncDrill["d"+q.nc]){ S.ncDrill["d"+q.nc]=1; checkBadges(); } }
  FORGE.results.push({q, ok, pick, inputVal});
  save(); renderForgeQ();
}
function forgeNext(){
  FORGE.i++; FORGE.answered = false; FORGE.left = QTIME;
  if(FORGE.i >= FORGE.qs.length){ finishForge(); } else { render(); }
}
function finishForge(){
  const pct = Math.round(FORGE.score/FORGE.qs.length*100);

  save(); FORGE.done = true; render();
}

function renderForgeQ(){
  const qc = $("#forgeQ"); if(!qc) return;
  const q = FORGE.qs[FORGE.i];
  const res = FORGE.answered ? FORGE.results[FORGE.results.length-1] : null;
  qc.innerHTML = '<div class="drillq">'+q.q+'</div>';
  if(q.type==="mcq"){
    const wrap = el("div",""); wrap.style.cssText = "display:grid;gap:9px;margin-top:14px";
    q.opts.forEach((o,i)=>{
      const b = el("div","opt",'<span class="ol">'+"ABCD"[i]+'</span><span>'+o+'</span>');
      if(res){ if(i===q.a) b.classList.add("correct"); else if(res.pick===i) b.classList.add("wrong"); b.style.cursor="default"; }
      else b.onclick = ev=>forgeAnswer(i, ev);
      wrap.appendChild(b);
    });
    qc.appendChild(wrap);
  } else {
    const inp = el("input","ansbox"); inp.placeholder = "type your answer + Enter"; inp.style.marginTop = "14px";
    if(res){ inp.value = res.inputVal||"(no answer)"; inp.disabled = true; inp.classList.add(res.ok?"correct":"wrong"); }
    else { inp.addEventListener("keydown",e=>{ if(e.key==="Enter") forgeAnswer(null, e, inp.value); });
      setTimeout(()=>inp.focus(),50); }
    qc.appendChild(inp);
    if(!res){ const fire = el("button","btn primary","⚡ SUBMIT"); fire.style.marginTop="11px"; fire.onclick = ev=>forgeAnswer(null, ev, inp.value); qc.appendChild(fire); }
    if(res && !res.ok) qc.appendChild(el("div","sub","Correct: <b class=\"mono\">"+q.a[0]+"</b>"));
  }
  if(res){
    qc.appendChild(el("div","explain",(res.ok?"<b>✔ CORRECT.</b> ":"<b>✘ "+(res.pick===-1&&q.type==='mcq'?"TIME UP.":"WRONG.")+"</b> ")+q.exp));
    const nx = el("button","btn primary", FORGE.i+1>=FORGE.qs.length ? "Finish →" : "Next question →");
    nx.style.marginTop = "13px"; nx.onclick = forgeNext; qc.appendChild(nx);
  }
}
function renderForgeResult(v){
  const pct = Math.round(FORGE.score/FORGE.qs.length*100);
  const verdict = pct>=80? ["var(--ok)","ELITE. Exam-grade accuracy."] : pct>=60? ["var(--warn)","Solid — patch the misses below."] : ["var(--bad)","Gap detected. Re-open the mastery doc, then re-run this arena."];
  const c = el("div","card","");
  c.style.textAlign = "center";
  c.innerHTML = '<div style="font-size:.7rem;letter-spacing:.3em;color:var(--tx2);font-weight:900">FORGE REPORT — '+FORGE.subj+'</div>'+
    '<div style="font-size:3.4rem;font-weight:900;font-family:Consolas,monospace;color:'+verdict[0]+'">'+FORGE.score+'/'+FORGE.qs.length+'</div>'+
    '<div style="font-weight:700;color:'+verdict[0]+'">'+verdict[1]+'</div>'+
    '<div style="display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap"><button class="btn primary" onclick="startForge(FORGE.subj, FORGE.qs.length)">⟳ Re-run arena</button><button class="btn" onclick="FORGE=null;render()">Back to Forge</button></div>';
  v.appendChild(c);
  v.appendChild(el("div","sectitle","ITEMIZED DEBRIEF"));
  FORGE.results.forEach((r,i)=>{
    v.appendChild(el("div","card tight",'<div style="display:flex;gap:10px;align-items:flex-start"><b style="color:'+(r.ok?"var(--ok)":"var(--bad)")+';font-family:Consolas,monospace">'+(r.ok?"✔":"✘")+' Q'+(i+1)+'</b><div style="flex:1"><div style="font-size:.84rem;font-weight:600">'+r.q.q+'</div><div class="sub" style="margin-top:5px">'+r.q.exp+'</div></div></div>'));
  });
}

/* ============================================================
   §16 VIEW — AWARDS
   ============================================================ */
function renderAwards(v){
  v.appendChild(el("h1","pagetitle","🏅 Hall of Achievements"));
  const got = Object.keys(S.badges).length;
  v.appendChild(el("div","sub","<b>"+got+"</b> of "+BADGES.length+" unlocked · each badge = +50 bonus XP. The last one requires the summit itself."));
  const g = el("div","grid g5"); g.style.marginTop = "18px";
  BADGES.forEach(b=>{
    const on = !!S.badges[b.id];
    g.appendChild(el("div","badge"+(on?" unlocked":" locked"), badgeSVG(b,56)+'<div class="bname">'+b.n+'</div><div class="bdesc">'+b.d+(on?'<br><span style="color:var(--gold)">'+new Date(S.badges[b.id]).toLocaleDateString()+'</span>':'')+'</div>'));
  });
  v.appendChild(g);
}

/* ============================================================
   §17 VIEW — SAVE / SYNC
   ============================================================ */
function renderData(v){
  v.appendChild(el("h1","pagetitle","💾 Save / Sync Bay"));
  v.appendChild(el("div","sub","Progress auto-saves to this browser ("+(memFallback?"<b style='color:var(--bad)'>storage blocked — use Export!</b>":"localStorage active")+"). Export a snapshot for backup, or to paste into a Claude chat so your tutor sessions and this dashboard stay in sync."));
  const c = el("div","card"); c.style.marginTop = "16px";
  const ta = el("textarea","ansbox"); ta.style.cssText = "width:100%;height:130px;font-size:.7rem;resize:vertical;margin-top:10px"; ta.placeholder = "Exported state appears here / paste a snapshot to import…";
  const row = el("div",""); row.style.cssText = "display:flex;gap:9px;flex-wrap:wrap";
  const ex = el("button","btn primary","⬇ Export snapshot");
  ex.onclick = ()=>{ ta.value = JSON.stringify(S); ta.select(); try{document.execCommand("copy"); toast("Snapshot copied to clipboard.");}catch(e){ toast("Snapshot ready — copy it manually."); } };
  const dl = el("button","btn","Download .json");
  dl.onclick = ()=>{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download = "AAA_progress_"+new Date().toISOString().slice(0,10)+".json"; a.click(); };
  const im = el("button","btn","⬆ Import from box");
  im.onclick = ()=>{ try{ const o = JSON.parse(ta.value); if(!o||typeof o.xp!=="number") throw 0; S = Object.assign(DEFAULT_STATE(), o); save(); toast("State imported."); render(); }catch(e){ toast("⚠ Invalid snapshot."); } };
  const rs = el("button","btn danger","Reset ALL progress");
  rs.onclick = ()=>{ if(confirm("Wipe XP, streak, every checkbox? This cannot be undone.")){ S = DEFAULT_STATE(); save(); render(); } };
  row.appendChild(ex); row.appendChild(dl); row.appendChild(im); row.appendChild(rs);
  c.appendChild(row); c.appendChild(ta); v.appendChild(c);
  v.appendChild(el("div","sectitle","SYSTEM LINKAGE"));
  v.appendChild(el("div","card tight",'<table class="dt"><tr><th>Layer</th><th>Where</th></tr>'+
   '<tr><td><b>This dashboard</b></td><td class="mono">Finals Subjects/COMMAND_CENTER.html — open any time, any browser</td></tr>'+
   '<tr><td><b>AI tutor state</b></td><td class="mono">&lt;SUBJECT&gt;/Storage/Update_status/&lt;SUBJECT&gt;_STATUS.md — say “Hello SDA” in Claude</td></tr>'+
   '<tr><td><b>Study arsenal</b></td><td class="mono">&lt;SUBJECT&gt;/Learning space/ — 105 files: mastery, drills, intel, mocks</td></tr>'+
   '<tr><td><b>Sync ritual</b></td><td>After a Claude session: tick the matching units here. Before a session: export a snapshot and paste it into the chat.</td></tr></table>'));
}

window.__AAA__ = { get S(){return S}, set S(v){S=v}, get FORGE(){return FORGE}, version:"1.0" }; // integration/debug hook
touchStreak(); save();
nav("dashboard");
setTimeout(()=>{ if(!Object.keys(S.units).length) toast("⚡ <b>Command Center online.</b> 105-file Tower linked. Start with today's quests, Commander.", true); }, 600);
